<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>NOVUS - Autenticación de Kernel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #050505; color: #ff3e3e; font-family: 'Courier New', monospace; }
        .glitch-text { text-shadow: 2px 0 #00ff41, -2px 0 #5d5fef; }
        .auth-card { background: rgba(10, 10, 10, 0.9); border: 1px solid #ff3e3e; box-shadow: 0 0 20px rgba(255, 62, 62, 0.2); }
        input { background: #000 !important; border: 1px solid #333 !important; color: #00ff41 !important; letter-spacing: 0.5em; text-align: center; }
        input:focus { border-color: #00ff41 !important; outline: none; box-shadow: 0 0 10px rgba(0, 255, 65, 0.2); }
    </style>
</head>
<body class="h-screen flex items-center justify-center overflow-hidden">
    
    <div class="absolute inset-0 pointer-events-none opacity-10 bg-[linear-gradient(rgba(18,16,16,0)_50%,rgba(0,0,0,0.25)_50%),linear-gradient(90deg,rgba(255,0,0,0.06),rgba(0,255,0,0.02),rgba(0,0,255,0.06))] z-0" style="background-size: 100% 4px, 3px 100%;"></div>

    <div class="auth-card p-8 rounded-lg w-full max-w-md z-10 text-center">
        <div class="mb-6">
            <i class="fas fa-user-shield text-4xl mb-4"></i>
            <h1 class="text-xl font-bold glitch-text uppercase">Validación de Identidad</h1>
            <p class="text-[10px] text-gray-500 mt-2 uppercase tracking-widest">Protocolo SIEM-SEC-01</p>
        </div>

        <div class="bg-red-500/10 border border-red-500/30 p-4 mb-6 rounded">
            <p class="text-[11px] text-red-400">
                Se ha enviado un código de encriptación temporal al correo registrado: 
                <span class="font-bold text-white">{{ user.email }}</span>
            </p>
        </div>

        <form action="/siem/verify" method="POST" class="space-y-6">
            <div>
                <label class="block text-[10px] uppercase mb-2 text-gray-400">Ingrese Token de 6 Dígitos</label>
                <input type="text" name="token" maxlength="6" required autofocus
                       placeholder="******" 
                       class="w-full py-3 text-2xl font-black rounded">
            </div>

            <button type="submit" class="w-full bg-red-600 hover:bg-red-500 text-white py-3 rounded font-bold uppercase text-xs tracking-tighter transition-all">
                Verificar y Acceder al Kernel
            </button>
        </form>

        <div class="mt-8 pt-4 border-t border-gray-900 flex justify-between items-center text-[9px] text-gray-600">
            <span>SESIÓN: {{ hostname if hostname is defined else 'Sin datos disponibles' }}</span>
            <span class="animate-pulse">SISTEMA EN ESCANEO...</span>
        </div>
    </div>

    <script>
        document.querySelector('input').addEventListener('input', function (e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });
    </script>
</body>
</html>
