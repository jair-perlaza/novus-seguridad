<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <title>WSAE — NOVUS</title>
  <style>
    body { margin:0; font-family: "Segoe UI", system-ui, sans-serif; background:#0f1419; color:#e7ecf1; }
    main { max-width:960px; margin:0 auto; padding:2rem 1.25rem; }
    pre { background:#1a222c; border:1px solid #2a3542; border-radius:8px; padding:12px; overflow:auto; font-size:.8rem; }
    a { color:#3dd68c; }
  </style>
  {% include 'partials/responsive_assets.html' %}
</head>
<body>
<main>
  <h1>WSAE — Web Security Auth Enterprise</h1>
  <p style="color:#8b9aab">Estado del motor de autenticación web — LIVE.</p>
  <pre id="raw">Cargando…</pre>
  <p><a href="/api/wsae/status">API status</a></p>
</main>
<script>
async function load() {
  try {
    const r = await fetch('/api/wsae/status', {credentials:'same-origin'}).then(x=>x.json());
    document.getElementById('raw').textContent = JSON.stringify(r, null, 2);
  } catch (e) {
    document.getElementById('raw').textContent = 'NOT VERIFIED: ' + e.message;
  }
}
load();
</script>
</body>
</html>
