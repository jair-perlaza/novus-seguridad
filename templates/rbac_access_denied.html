<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVUS — Acceso denegado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>body { background: #06090f; color: white; font-family: Inter, sans-serif; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full border border-red-900/40 bg-[#0c121d] rounded-xl p-8 text-center">
        <i class="fas fa-shield-alt text-red-400 text-3xl mb-4"></i>
        <h1 class="text-xl font-bold uppercase tracking-tight mb-2">Acceso denegado</h1>
        <p class="text-sm text-gray-300 mb-4">{{ message or 'No tiene permisos para acceder a este recurso.' }}</p>
        {% if detail %}<p class="text-xs text-gray-500 mb-4">{{ detail }}</p>{% endif %}
        <p class="text-[10px] text-gray-600 mb-6">Ruta: {{ path or '—' }} · Evento registrado en auditoría</p>
        <a href="{{ url_for('dashboard.dashboard_principal') }}" class="inline-block px-4 py-2 rounded-lg bg-indigo-600 text-xs font-bold no-underline text-white">Volver al Dashboard</a>
    </div>
</body>
</html>
